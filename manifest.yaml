# Workspace extension manifest: tool + config metadata (descriptions, JSON
# schemas, required_config). Handlers (execute) live in src/index.ts; the SDK's
# parseManifest/manifestConfig joins the two, exactly like the other extensions.
id: workspace
version: 0.15.0
tools:
  - name: sandbox-create
    description: 'Create a sandbox and wait up to 60s for it to become healthy. A sandbox runs a PRE-BUILT image that already bundles the worker — the gateway no longer injects anything. `image` must be one of the deployment sandbox images from the dedicated sandbox org (see list-oci-images with owner="sandbox"); omit it for the deployment default. A name is never reused: if a sandbox with this name already exists the call is refused — delete it first with sandbox-delete. Returns the sandbox name, its in-cluster service DNS, and the worker environment (OS/arch, workspace root, boot id).'
    descriptions:
      zh: 创建沙箱并最多等待 60 秒就绪。沙箱运行的是预构建、已内置 worker 的镜像——网关不再做任何注入。`image` 必须是部署沙箱镜像（见 list-oci-images，owner="sandbox"）之一；省略则用部署默认镜像。沙箱名不可复用：若同名沙箱已存在则拒绝创建——请先用 sandbox-delete 删除。返回沙箱名、集群内服务域名，以及 worker 环境（OS/架构、工作区根目录、boot id）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Logical sandbox name. Must not already exist (a name is never reused; delete first).
          descriptions:
            zh: 逻辑沙箱名。不得已存在（沙箱名不可复用；请先删除）。
        image:
          type: string
          description: Sandbox image from the sandbox org (see list-oci-images; omit for the deployment default).
          descriptions:
            zh: 沙箱组织下的沙箱镜像（见 list-oci-images；省略则用部署默认）。
        cpu:
          type: string
          description: CPU request=limit, e.g. 500m or 1. Omit to use the deployment defaults (request 500m, limit 2).
          descriptions:
            zh: CPU 请求=上限，如 500m 或 1。省略则用部署默认（请求 500m、上限 2）。
        memory:
          type: string
          description: Memory request=limit, e.g. 1Gi. Omit to use the deployment defaults (request 1Gi, limit 4Gi).
          descriptions:
            zh: 内存请求=上限，如 1Gi。省略则用部署默认（请求 1Gi、上限 4Gi）。
        kvm:
          type: boolean
          description: Request KVM (/dev/kvm) — non-privileged, via the device plugin.
          descriptions:
            zh: 请求 KVM（/dev/kvm）——非特权，经 device plugin。
        gpu-count:
          type: integer
          description: Number of NVIDIA GPUs to request (0 = none; needs the GPU device plugin).
          descriptions:
            zh: 请求的 NVIDIA GPU 卡数（0 = 无；需 GPU device plugin）。
        env:
          type: object
          description: Extra environment variables for the worker container.
          descriptions:
            zh: 为 worker 容器附加的环境变量。
          additionalProperties:
            type: string
      required:
        - name
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-list
    description: List every managed sandbox (name, phase, image, url, created, creator).
    descriptions:
      zh: 列出所有受管沙箱（名称、状态、镜像、地址、创建时间、创建者）。
    input_schema:
      type: object
      properties: {}
      required: []
    required_config:
      - gateway-url
      - gateway-token
  - name: list-oci-images
    description: "Browse OCI images in the registry. `owner` selects the namespace (default: the deployment toolchain org; use owner=\"sandbox\" to list the deployable SANDBOX images). Pass `name` to list ONE image's tags; omit it to list all of the owner's images. Returns full refs; only `sandbox` refs are usable with sandbox-create."
    descriptions:
      zh: 浏览 registry 中的 OCI 镜像。`owner` 选择命名空间（默认：部署的 toolchain 组织；用 owner="sandbox" 列出可部署的沙箱镜像）。传 `name` 列出单个镜像的所有 tag；省略则列出该 owner 的全部镜像。返回完整引用；只有 `sandbox` 下的引用可用于 sandbox-create。
    input_schema:
      type: object
      properties:
        owner:
          type: string
          description: "Owner (user or org) namespace (default: the deployment toolchain org)."
          descriptions:
            zh: owner（用户或组织）命名空间（默认：部署的 toolchain 组织）。
        name:
          type: string
          description: Image name to list tags for (omit to list all images).
          descriptions:
            zh: 要列出 tag 的镜像名（省略则列出全部镜像）。
      required: []
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-status
    description: "Show one sandbox's live state (phase, ready, image, url), plus diagnostics: container restarts and the failure reason (e.g. OOMKilled) when the sandbox exited."
    descriptions:
      zh: 查看单个沙箱的实时状态（阶段、是否就绪、镜像、地址），以及诊断信息：容器重启次数与退出原因（如 OOMKilled）。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
      required:
        - worker-name
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-delete
    description: Delete a sandbox (its Pod + Service + Secret).
    descriptions:
      zh: 删除沙箱（其 Pod + Service + Secret）。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
      required:
        - worker-name
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-info
    description: "Show the sandbox environment: OS/arch, shell, workspace root, home dir (`~`), in-cluster service DNS, boot id and the image's probed CAPABILITIES (desktop/display, noVNC, accessibility `xa11y`, distro). File tools accept a leading `~` as an alias for this home dir. Capabilities are best-effort: a capability missing here means 'not detected', not 'impossible'."
    descriptions:
      zh: 查看沙箱环境：OS/架构、shell、工作区根目录、主目录（`~`）、集群内服务域名、boot id，以及镜像探测到的能力（桌面/显示协议、noVNC、无障碍 `xa11y`、发行版）。文件工具的 `~` 前缀即指该主目录。能力为尽力探测：未列出表示"未检测到"，而非"不可能"。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
      required:
        - worker-name
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-exec
    description: "Run a short shell command in the sandbox workspace and wait up to `timeout` seconds. Returns the job id always; on completion up to 1000 lines of output, on timeout the oldest 200 lines plus a note that the job is still running. IMPORTANT: the remote worker runs every command as a background job and records its full output. Do NOT background the command yourself with &, nohup, setsid, disown, or `&` in a subshell; do NOT truncate or redirect output with pipes (e.g. `| head`/`| tail`) or redirection (e.g. `> file`, `2>&1`, `>> file`); do NOT run a daemon/server in the foreground expecting the call to return. Run the command as-is (the worker streams and stores stdout/stderr), then read the result with the job-output/job-wait tools."
    descriptions:
      zh: 在沙箱工作区运行一个短命令，最多等待 `timeout` 秒。总是返回 job id；完成时最多返回 1000 行输出，超时则返回最旧的 200 行并提示任务仍在运行。重要：远端 worker 会把每条命令都作为后台任务运行并记录完整输出。请勿自行用 &、nohup、setsid、disown 或子 shell 的 & 将命令放到后台；请勿用管道截断输出（如 `| head`/`| tail`）或重定向输出（如 `> file`、`2>&1`、`>> file`）；也请勿在前台运行常驻的守护进程/服务并指望调用立即返回。请原样运行命令（worker 会流式记录 stdout/stderr），再用 job-output/job-wait 工具读取结果。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        command:
          type: string
          description: "Shell command to run. IMPORTANT: the remote worker runs every command as a background job and records its full output. Do NOT background the command yourself with &, nohup, setsid, disown, or `&` in a subshell; do NOT truncate or redirect output with pipes (e.g. `| head`/`| tail`) or redirection (e.g. `> file`, `2>&1`, `>> file`); do NOT run a daemon/server in the foreground expecting the call to return. Run the command as-is (the worker streams and stores stdout/stderr), then read the result with the job-output/job-wait tools."
          descriptions:
            zh: 要运行的 shell 命令。重要：远端 worker 会把每条命令都作为后台任务运行并记录完整输出。请勿自行用 &、nohup、setsid、disown 或子 shell 的 & 将命令放到后台；请勿用管道截断输出（如 `| head`/`| tail`）或重定向输出（如 `> file`、`2>&1`、`>> file`）；也请勿在前台运行常驻的守护进程/服务并指望调用立即返回。请原样运行命令（worker 会流式记录 stdout/stderr），再用 job-output/job-wait 工具读取结果。
        workdir:
          type: string
          description: "Working directory: relative to the workspace root, absolute, or starting with `~` (the worker home). A leading `~` or `~/...` expands to the worker's home dir (see sandbox-info)."
          descriptions:
            zh: 工作目录：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。 以 `~` 或 `~/...` 开头会展开为 worker 主目录（见 sandbox-info）。
        timeout:
          type: integer
          description: Synchronous wait ceiling in seconds (default 5, max 60).
          descriptions:
            zh: 同步等待上限（秒，默认 5，最大 60）。
        env:
          type: object
          description: Extra environment variables for the job.
          descriptions:
            zh: 为任务附加的环境变量。
          additionalProperties:
            type: string
      required:
        - worker-name
        - command
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-job-start
    description: "Start a long-running shell command and return the job id immediately (no waiting). Drive it with sandbox-job-wait/sandbox-job-output/sandbox-job-stdin/sandbox-job-kill. To stop a long job, call sandbox-job-kill yourself — no deadline is armed. IMPORTANT: the remote worker runs every command as a background job and records its full output. Do NOT background the command yourself with &, nohup, setsid, disown, or `&` in a subshell; do NOT truncate or redirect output with pipes (e.g. `| head`/`| tail`) or redirection (e.g. `> file`, `2>&1`, `>> file`); do NOT run a daemon/server in the foreground expecting the call to return. Run the command as-is (the worker streams and stores stdout/stderr), then read the result with the job-output/job-wait tools."
    descriptions:
      zh: 启动一个长时间运行的 shell 命令并立即返回 job id（不等待）。用 sandbox-job-wait/sandbox-job-output/sandbox-job-stdin/sandbox-job-kill 进行后续控制。要停止长任务请自行调用 sandbox-job-kill——不会自动设置截止时间。重要：远端 worker 会把每条命令都作为后台任务运行并记录完整输出。请勿自行用 &、nohup、setsid、disown 或子 shell 的 & 将命令放到后台；请勿用管道截断输出（如 `| head`/`| tail`）或重定向输出（如 `> file`、`2>&1`、`>> file`）；也请勿在前台运行常驻的守护进程/服务并指望调用立即返回。请原样运行命令（worker 会流式记录 stdout/stderr），再用 job-output/job-wait 工具读取结果。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        command:
          type: string
          description: "Shell command to run. IMPORTANT: the remote worker runs every command as a background job and records its full output. Do NOT background the command yourself with &, nohup, setsid, disown, or `&` in a subshell; do NOT truncate or redirect output with pipes (e.g. `| head`/`| tail`) or redirection (e.g. `> file`, `2>&1`, `>> file`); do NOT run a daemon/server in the foreground expecting the call to return. Run the command as-is (the worker streams and stores stdout/stderr), then read the result with the job-output/job-wait tools."
          descriptions:
            zh: 要运行的 shell 命令。重要：远端 worker 会把每条命令都作为后台任务运行并记录完整输出。请勿自行用 &、nohup、setsid、disown 或子 shell 的 & 将命令放到后台；请勿用管道截断输出（如 `| head`/`| tail`）或重定向输出（如 `> file`、`2>&1`、`>> file`）；也请勿在前台运行常驻的守护进程/服务并指望调用立即返回。请原样运行命令（worker 会流式记录 stdout/stderr），再用 job-output/job-wait 工具读取结果。
        workdir:
          type: string
          description: "Working directory: relative to the workspace root, absolute, or starting with `~` (the worker home). A leading `~` or `~/...` expands to the worker's home dir (see sandbox-info)."
          descriptions:
            zh: 工作目录：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。 以 `~` 或 `~/...` 开头会展开为 worker 主目录（见 sandbox-info）。
        env:
          type: object
          description: Extra environment variables for the job.
          descriptions:
            zh: 为任务附加的环境变量。
          additionalProperties:
            type: string
      required:
        - worker-name
        - command
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-job-output
    description: Read a job's output by line window (offset/limit; offset negative counts from the end). Display is capped at 1000 lines / 120 KiB.
    descriptions:
      zh: 按行窗口读取任务输出（offset/limit；offset 为负从末尾计数）。展示上限 1000 行 / 120 KiB。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        job-id:
          type: string
          description: Background job id.
          descriptions:
            zh: 后台任务 id。
        offset:
          type: integer
          description: Start line offset (negative = from the end, default 0).
          descriptions:
            zh: 起始行偏移（负值从末尾算，默认 0）。
        limit:
          type: integer
          description: Maximum lines to return (default 200, max 1000).
          descriptions:
            zh: 最多返回行数（默认 200，最大 1000）。
        stream:
          type: string
          enum:
            - all
            - stdout
            - stderr
          description: Which stream to read (default all).
          descriptions:
            zh: 读取哪个流（默认 all）。
      required:
        - worker-name
        - job-id
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-job-wait
    description: Wait up to `timeout` seconds for a job to finish; returns the latest 200 lines of output. If it is still running at the deadline, says so.
    descriptions:
      zh: 最多等待 `timeout` 秒让任务结束；返回最新的 200 行输出。若到点仍在运行则明确提示。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        job-id:
          type: string
          description: Background job id.
          descriptions:
            zh: 后台任务 id。
        timeout:
          type: integer
          description: Wait ceiling in seconds (default 60, max 300).
          descriptions:
            zh: 等待上限（秒，默认 60，最大 300）。
      required:
        - worker-name
        - job-id
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-job-kill
    description: Kill a job and its whole process tree.
    descriptions:
      zh: 终止任务及其整个进程树。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        job-id:
          type: string
          description: Background job id.
          descriptions:
            zh: 后台任务 id。
      required:
        - worker-name
        - job-id
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-job-stdin
    description: Write to a job's stdin, optionally closing it.
    descriptions:
      zh: 向任务的 stdin 写入数据，可选关闭。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        job-id:
          type: string
          description: Background job id.
          descriptions:
            zh: 后台任务 id。
        data:
          type: string
          description: Text to write to stdin.
          descriptions:
            zh: 写入 stdin 的文本。
        close:
          type: boolean
          description: Close stdin after writing.
          descriptions:
            zh: 写入后关闭 stdin。
      required:
        - worker-name
        - job-id
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-job-list
    description: "List jobs registered in the worker: RUNNING jobs first, then the rest newest-first. Each row is id / state / exit / command (the text collapses a multi-line command to one truncated line; the card shows it in full). `limit` caps the number of jobs (default 50, max 500)."
    descriptions:
      zh: 列出 worker 中登记的任务：**进行中的优先**，其余按启动时间倒序。每行为 id / 状态 / 退出码 / 命令（文本会把多行命令折叠为一行并截断；卡片显示完整命令）。`limit` 限制条数（默认 50，最大 500）。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        limit:
          type: integer
          description: Maximum jobs to return (default 50, max 500).
          descriptions:
            zh: 最多返回条数（默认 50，最大 500）。
      required:
        - worker-name
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-file-read
    description: Read a text file from the sandbox workspace with line numbers, windowed by offset/limit (the window is fetched server-side, so a slice of a huge file is not fully transferred). Binary files are rejected. Read first so a later sandbox-file-patch matches the exact context/removed lines.
    descriptions:
      zh: 从沙箱工作区读取文本文件并带行号，通过 offset/limit 分窗（窗口在服务端获取，大文件只取所需片段）。二进制文件会被拒绝。请先 read，以便之后的 sandbox-file-patch 能匹配到确切的上下文/待删行。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        path:
          type: string
          description: "File path: relative to the workspace root, absolute, or starting with `~` (the worker home). A leading `~` or `~/...` expands to the worker's home dir (see sandbox-info)."
          descriptions:
            zh: 文件路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。 以 `~` 或 `~/...` 开头会展开为 worker 主目录（见 sandbox-info）。
        offset:
          type: integer
          description: Start line (0-based, default 0).
          descriptions:
            zh: 起始行（从 0 开始，默认 0）。
        limit:
          type: integer
          description: Maximum lines (default 200, max 1000).
          descriptions:
            zh: 最多行数（默认 200，最大 1000）。
      required:
        - worker-name
        - path
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-file-patch
    description: >-
      Apply a multi-file PATCH to the sandbox workspace in ONE call — the way to
      create, edit, and delete files. The patch language is a small, line-oriented
      format: wrap one or more file sections between `*** Begin Patch` and
      `*** End Patch`. Each section starts with a header:
      `*** Add File: <path>` (every following line is a `+` line = the new
      content), `*** Delete File: <path>` (nothing follows), or
      `*** Update File: <path>` (followed by one or more `@@` hunks). Inside an
      Update hunk, each line is prefixed with a single space (unchanged context),
      `-` (a line to remove) or `+` (a line to add); an optional `@@ <text>` line
      anchors the hunk to a nearby unique line, and `*** End of File` marks a hunk
      that must land at the end. `*** Move to:` is NOT supported. Read a file
      first (sandbox-file-read) so your context/removed lines match exactly; the
      tool refuses the WHOLE patch (nothing is written) if any hunk fails to
      match. The patch is applied atomically: every file is computed first, then
      written. Existing files keep their line endings and BOM. Returns a
      per-file summary (A/M/D) followed by a unified diff.
    descriptions:
      zh: >-
        在沙箱工作区以【一次调用】应用多文件补丁——这是创建、修改、删除文件的唯一方式。补丁语言是一种小而面向行的格式：用 `*** Begin Patch` 与
        `*** End Patch` 包裹一个或多个文件段。每段以头部开始：`*** Add File: <路径>`（其后每行以 `+` 开头 = 新文件内容）、
        `*** Delete File: <路径>`（其后无内容）、或 `*** Update File: <路径>`（后跟一个或多个 `@@` hunk）。Update hunk 内每行以单字符前缀：
        空格（未改动的上下文）、`-`（删除该行）、`+`（新增该行）；可选的 `@@ <文本>` 行把 hunk 锚定到附近某条唯一行，`*** End of File`
        标记必须落在文件末尾的 hunk。不支持 `*** Move to:`。请先用 sandbox-file-read 读取文件，确保上下文/待删行完全一致；任
        hunk 匹配失败则整份补丁被拒绝（不写入任何内容）。补丁是原子的：先计算所有文件，再统一写入。已有文件保留其换行符与 BOM。
        返回每个文件的一行摘要（A/M/D）以及一份 unified diff。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        patch-text:
          type: string
          description: "The full patch text: one or more `*** Add File:` / `*** Update File:` / `*** Delete File:` sections wrapped in `*** Begin Patch` / `*** End Patch`. Paths are relative to the workspace root, absolute, or start with `~` (the worker home)."
          descriptions:
            zh: "完整补丁文本：一个或多个 `*** Add File:` / `*** Update File:` / `*** Delete File:` 段，用 `*** Begin Patch` / `*** End Patch` 包裹。路径相对工作区根、绝对，或以 `~`（worker 主目录）开头。"
      required:
        - worker-name
        - patch-text
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-file-ls
    description: List a sandbox path as a tree (levels 1..depth) with sizes, in ONE server-side recursive listing. Directories beyond the cap stay collapsed.
    descriptions:
      zh: 以树形（第 1..depth 层）列出沙箱路径并显示大小，单次服务端递归列出。超过上限的目录保持折叠。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        path:
          type: string
          description: "Directory or file path: relative to the workspace root, absolute, or starting with `~` (the worker home). A leading `~` or `~/...` expands to the worker's home dir (see sandbox-info)."
          descriptions:
            zh: 目录或文件路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。 以 `~` 或 `~/...` 开头会展开为 worker 主目录（见 sandbox-info）。
        limit:
          type: integer
          description: Maximum entries (default 200, max 1000).
          descriptions:
            zh: 最大条目数（默认 200，最大 1000）。
        depth:
          type: integer
          description: Levels to expand (default 3).
          descriptions:
            zh: 展开层数（默认 3）。
      required:
        - worker-name
        - path
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-file-download
    description: Download a stored file (agent `file:<code>`) into the sandbox workspace at `path`.
    descriptions:
      zh: 将已存储文件（agent 的 `file:<code>`）下载到沙箱工作区的 `path`。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        code:
          type: string
          description: File code (with or without the `file:` prefix).
          descriptions:
            zh: 文件 code（可带或不带 `file:` 前缀）。
        path:
          type: string
          description: Destination path in the workspace (relative, absolute, or starting with `~`). A leading `~` or `~/...` expands to the worker's home dir (see sandbox-info).
          descriptions:
            zh: 工作区中的目标路径（相对、绝对，或以 `~` 开头）。 以 `~` 或 `~/...` 开头会展开为 worker 主目录（见 sandbox-info）。
      required:
        - worker-name
        - code
        - path
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-file-upload
    description: Upload a sandbox file to the agent file store, returning its `file:<code>`. The content type is derived by the agent.
    descriptions:
      zh: 将沙箱文件上传到 agent 文件存储，返回 `file:<code>`。内容类型由 agent 推断。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        path:
          type: string
          description: "File path: relative to the workspace root, absolute, or starting with `~` (the worker home). A leading `~` or `~/...` expands to the worker's home dir (see sandbox-info)."
          descriptions:
            zh: 文件路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。 以 `~` 或 `~/...` 开头会展开为 worker 主目录（见 sandbox-info）。
        name:
          type: string
          description: Stored file name (defaults to the basename).
          descriptions:
            zh: 存储文件名（默认取 basename）。
      required:
        - worker-name
        - path
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-checkout
    description: Download a repository tree (Forgejo archive at `ref`) into the sandbox workspace. With clean=true the workspace is emptied first; clean=false (default) keeps sandbox-only files and only replaces files present in the repo.
    descriptions:
      zh: 把仓库树（Forgejo 在 `ref` 处的归档）下载到沙箱工作区。clean=true 先清空工作区；clean=false（默认）保留沙箱独有文件，仅替换仓库中存在的文件。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        dest:
          type: string
          description: "The EXACT directory (relative to the workspace root, or starting with `~`) the repository tree is unpacked into; the repo's README ends up at `<dest>/README.md`. Defaults to the repository name, so the default layout is `<workspace>/<repo>/README.md`. Pass a different name to rename (e.g. `myapp`), or a nested path."
          descriptions:
            zh: 仓库树解包的【确切目录】（相对工作区根，或以 `~` 开头）；仓库的 README 会落在 `<dest>/README.md`。默认使用仓库名，即默认布局为 `<workspace>/<仓库名>/README.md`。传其他名字即可重命名（如 `myapp`），也可用嵌套路径。
        clean:
          type: boolean
          description: Empty the destination before unpacking (default false).
          descriptions:
            zh: 解包前清空目标目录（默认 false）。
      required:
        - worker-name
        - org
        - repo
    required_config:
      - gateway-url
      - gateway-token
  - name: sandbox-submit-mr
    description: >-
      Submit the sandbox's changes as a change request — the ONLY way to change a
      branch. It diffs the repo directory `path` inside the sandbox against
      `base`, then the gateway materializes the change set onto a NEW immutable
      `mr/...` head branch and opens an MR into `base`. A file present in `base`
      but absent in the sandbox is submitted as a DELETE. `base` and `path` are
      REQUIRED (`base` is the target branch, e.g. main; `path` is the repo
      directory in the sandbox, e.g. `myapp`). You may submit into any repository
      you can see (cross-repo allowed) and any branch. You can MERGE/CLOSE an MR
      only when its `base` is your OWN branch. Edit ONLY in a sandbox: there is
      no tool that writes a branch directly.
    descriptions:
      zh: >-
        把沙箱中的改动作为合并请求提交——这是改动分支的唯一方式。它会将沙箱内 `path`
        仓库目录与 `base` 做 diff，随后由 gateway 把改动集写入一个【新建、不可变】的 `mr/...` 头分支并向 `base`
        发起 MR。某文件在 `base` 存在而沙箱中缺失，则作为【删除】提交。`base` 与 `path`
        必填（`base` 是目标分支，如 main；`path` 是沙箱里的仓库目录，如 `myapp`）。你可以向你能看到的任何仓库（允许跨仓库）、任何分支提交。只有当 MR 的 `base`
        是你自己分支时才允许合并/关闭。所有改动都只能在沙箱里做：没有任何工具能直接写分支。
    input_schema:
      type: object
      properties:
        worker-name:
          type: string
          description: Sandbox name to run against (from sandbox-create or sandbox-list).
          descriptions:
            zh: 要操作的沙箱名（来自 sandbox-create 或 sandbox-list）。
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        base:
          type: string
          description: "REQUIRED target branch the MR merges into (e.g. main)."
          descriptions:
            zh: 必填。MR 要合并进入的目标分支（如 main）。
        path:
          type: string
          description: "REQUIRED: the repository directory inside the sandbox to diff and submit (relative to the workspace root), e.g. `myapp`."
          descriptions:
            zh: 必填。要对比并提交的沙箱内仓库目录（相对工作区根），如 `myapp`。
        title:
          type: string
          description: Change request title (defaults to a generated one).
          descriptions:
            zh: 合并请求标题（省略则自动生成）。
        body:
          type: string
          description: Change request description.
          descriptions:
            zh: 合并请求说明。
      required:
        - worker-name
        - org
        - repo
        - base
        - path
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-explore
    description: "Browse the Forgejo structure: list organizations (no org), or the repositories + branches of an org. Optional keyword filters org/repo names. Includes private repos."
    descriptions:
      zh: 浏览 Forgejo 结构：不传 org 时列出组织；传 org 时列出该组织的仓库与分支。可用 keyword 过滤组织/仓库名。包含私有仓库。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization name (omitted = list all organizations).
          descriptions:
            zh: 组织名（省略 = 列出所有组织）。
        repo:
          type: string
          description: Repository name (omitted = list all repos in the org).
          descriptions:
            zh: 仓库名（省略 = 列出该组织所有仓库）。
        keyword:
          type: string
          description: Case-insensitive substring matched against org/repo names.
          descriptions:
            zh: 对组织/仓库名做大小写不敏感的子串匹配。
      required: []
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-create-org
    description: Create an organization owned by the caller's tenant (idempotent). The gateway creates it under the shared Forgejo credential.
    descriptions:
      zh: 创建归属于调用方租户的组织（幂等）。gateway 用共享的 Forgejo 凭据创建。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization slug to create (required).
          descriptions:
            zh: 要创建的组织标识（必填）。
      required:
        - org
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-create-repo
    description: Create a PUBLIC repository under `org` (the gateway ensures the org + repo + a protected `main` branch and records ownership). The default branch is always `main`.
    descriptions:
      zh: 在 `org` 下创建一个公开仓库（gateway 负责确保组织 + 仓库 + 受保护的 `main` 分支，并记录归属）。默认分支固定为 `main`。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
      required:
        - org
        - repo
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-import
    description: Import an EXTERNAL git repository into an org as a PUBLIC repo (admin). `ref` selects the SOURCE ref to import — a branch, a tag, or any revision — and it ALWAYS lands on the new repo's `main`; with no `ref` the source's HEAD branch is imported. Only `main` is created (no other branches/tags). Refuses to overwrite an existing repo. `auth-token`/`auth-user` support private sources.
    descriptions:
      zh: 将外部 git 仓库作为公开仓库导入到某组织（管理员）。`ref` 选择要导入的源 ref——分支、标签或任意修订——它始终落到新仓库的 `main`；不给 `ref` 时导入源的 HEAD 分支。只创建 `main`（不带其它分支/标签）。已存在的仓库会被拒绝。`auth-token`/`auth-user` 支持私有源。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Target organization.
          descriptions:
            zh: 目标组织。
        url:
          type: string
          description: External git clone URL (https/ssh).
          descriptions:
            zh: 外部 git 克隆地址（https/ssh）。
        repo:
          type: string
          description: "Target repo name (default: derived from the URL)."
          descriptions:
            zh: 目标仓库名（默认：从 URL 推断）。
        ref:
          type: string
          description: "Source branch/tag/rev to import as `main` (default: the source HEAD branch)."
          descriptions:
            zh: 要作为 `main` 导入的源分支/标签/修订（默认：源 HEAD 分支）。
        auth-user:
          type: string
          description: Basic-auth username for a private source.
          descriptions:
            zh: 私有源的基本认证用户名。
        auth-token:
          type: string
          description: Access token for a private source.
          descriptions:
            zh: 私有源的访问令牌。
        description:
          type: string
          description: Repository description.
          descriptions:
            zh: 仓库描述。
      required:
        - org
        - url
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-remove
    description: "DESTRUCTIVE: delete a repository you own (admin) — the git repo, ALL its branch sessions (each cascading to its sandboxes) and the ownership record. The organization is kept. This cannot be undone."
    descriptions:
      zh: 危险操作：删除你拥有的仓库（管理员）——git 仓库、其全部分支会话（各自级联删除沙箱）以及归属记录。组织保留。不可撤销。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
      required:
        - org
        - repo
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-set-push-mirror
    description: "Register a PUSH MIRROR on a repository you own (admin): its commits are continuously pushed to an external HTTPS git remote. A repo may have MULTIPLE mirrors. Returns the Forgejo-assigned `remote-name` (needed to delete). `sync-on-commit` pushes immediately on every commit; otherwise `interval` (e.g. `8h`, `30m`) sets the periodic sync. `branch-filter` limits which branches are mirrored. `auth-user`/`auth-token` authenticate a private destination."
    descriptions:
      zh: 在你拥有的仓库上登记一个 PUSH MIRROR（管理员）：其提交会持续推送到外部 HTTPS git 远端。一个仓库可有多个 mirror。返回 Forgejo 分配的 `remote-name`（删除时需要）。`sync-on-commit` 表示每次提交立即推送；否则用 `interval`（如 `8h`、`30m`）设定周期同步。`branch-filter` 限定镜像哪些分支。`auth-user`/`auth-token` 用于私有目标认证。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        remote-url:
          type: string
          description: External HTTPS git URL to push to.
          descriptions:
            zh: 要推送到的外部 HTTPS git 地址。
        auth-user:
          type: string
          description: Basic-auth username for a private destination.
          descriptions:
            zh: 私有目标的基本认证用户名。
        auth-token:
          type: string
          description: Access token/password for a private destination.
          descriptions:
            zh: 私有目标的访问令牌/密码。
        sync-on-commit:
          type: boolean
          description: Push immediately on every commit (default false).
          descriptions:
            zh: 每次提交立即推送（默认 false）。
        interval:
          type: string
          description: Periodic sync interval, e.g. 8h or 30m (optional).
          descriptions:
            zh: 周期同步间隔，如 8h 或 30m（可选）。
        branch-filter:
          type: string
          description: Only mirror branches matching this glob (optional).
          descriptions:
            zh: 仅镜像匹配该 glob 的分支（可选）。
      required:
        - org
        - repo
        - remote-url
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-list-push-mirrors
    description: List the push mirrors configured on a repository you own (admin), with each mirror's remote name, address, interval and last sync error.
    descriptions:
      zh: 列出你拥有的仓库上已配置的 push mirror（管理员），含每个 mirror 的 remote name、地址、间隔与上次同步错误。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
      required:
        - org
        - repo
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-delete-push-mirror
    description: Remove a push mirror from a repository you own (admin) by its `remote-name` (as returned by repo-set-push-mirror / repo-list-push-mirrors).
    descriptions:
      zh: 按 `remote-name` 从你拥有的仓库移除一个 push mirror（管理员）（remote-name 由 repo-set-push-mirror / repo-list-push-mirrors 返回）。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        remote-name:
          type: string
          description: The mirror's remote_name to delete.
          descriptions:
            zh: 要删除的 mirror 的 remote_name。
      required:
        - org
        - repo
        - remote-name
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-build-image
    description: "Build a container image from a repository Dockerfile (context = a repo subdirectory) and push it to the deployment registry. IMPORTANT: the produced image does NOT get agent-worker injected — the Dockerfile must FROM a worker-bundled base image (built by `abc-protocol/worker`'s `sandbox-images/build.sh`) for the result to be usable as a sandbox. The result is not auto-added to the sandbox image catalog."
    descriptions:
      zh: 从仓库的 Dockerfile 构建容器镜像（上下文 = 仓库子目录）并推送到部署 registry。重要：产出的镜像不会注入 agent-worker——Dockerfile 必须 FROM 一个已内置 worker 的基础镜像（由 `abc-protocol/worker` 的 `sandbox-images/build.sh` 构建），产物才能作为沙箱使用。产物不会自动加入沙箱镜像目录。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        image:
          type: string
          description: Image name (single path segment, pushed under the deployment registry).
          descriptions:
            zh: 镜像名（单段路径，推送到部署 registry）。
        tag:
          type: string
          description: Image tag.
          descriptions:
            zh: 镜像标签。
        dockerfile:
          type: string
          description: Repo-relative Dockerfile path (default ./Dockerfile).
          descriptions:
            zh: 仓库相对 Dockerfile 路径（默认 ./Dockerfile）。
        context:
          type: string
          description: "Repo-relative build context subdirectory (default: repo root)."
          descriptions:
            zh: 仓库相对的构建上下文子目录（默认：仓库根）。
        build-args:
          type: object
          description: Build arguments (--build-arg k=v).
          descriptions:
            zh: 构建参数（--build-arg k=v）。
          additionalProperties:
            type: string
      required:
        - org
        - repo
        - image
        - tag
    required_config:
      - gateway-url
      - gateway-token
  - name: oci-import
    description: Mirror an upstream container image (public, or private with auth-user/auth-token) into the deployment registry under an org you own. The image lands at <registry>/<org>/<name>:<tag> and is then usable from service-deploy or as a sandbox base. This is the image analogue of repo-import. Only runnable images can be mirrored (not arbitrary OCI artifacts); multi-arch sources collapse to linux/amd64.
    descriptions:
      zh: 将上游容器镜像（公开，或经 auth-user/auth-token 的私有镜像）复制到部署 registry 中你拥有的 org 下。镜像落在 <registry>/<org>/<name>:<tag>，之后可用于 service-deploy 或作为沙箱基础镜像。这是镜像版的 repo-import。仅可复制可运行的镜像（不能是任意 OCI 产物）；多架构源会退化为 linux/amd64。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Destination org (must be owned by you; the image lands under it).
          descriptions:
            zh: 目标组织（必须归你所有；镜像将落在其下）。
        name:
          type: string
          description: Destination image name (single path segment).
          descriptions:
            zh: 目标镜像名（单段路径）。
        tag:
          type: string
          description: Destination tag (e.g. the upstream version).
          descriptions:
            zh: 目标标签（如上游版本号）。
        source:
          type: string
          description: Upstream image ref to mirror (e.g. docker.io/library/redis:7.4.2).
          descriptions:
            zh: 要复制的上游镜像引用（如 docker.io/library/redis:7.4.2）。
        auth-user:
          type: string
          description: Basic-auth username for a private source (optional).
          descriptions:
            zh: 私有源的基本认证用户名（可选）。
        auth-token:
          type: string
          description: Basic-auth token/password for a private source (optional).
          descriptions:
            zh: 私有源的基本认证令牌/密码（可选）。
      required:
        - org
        - name
        - tag
        - source
    required_config:
      - gateway-url
      - gateway-token
  - name: service-deploy
    description: "Deploy a container image as a LONG-LIVED Kubernetes service (Deployment + Service). Use this for something a sandbox talks to (an app, a proxy, ...), NOT for execution. The image runs as-is (no worker injection). Returns the in-cluster URL and anonymous public URLs (`https://<name>.<domain>`, one per public port). Set `services` to expose ports: each entry is `{ preset: tcp80|tcp443|udp443, target-port, name? }`. tcp80 is the ONLY publicly reachable preset (the app must serve HTTP on its target port); tcp443/udp443 are in-cluster only. Entries sharing the same `name` merge into one Service (multi-port); a second public endpoint needs a distinct `name` (its host becomes `<name>-<name>.<domain>`). Omit `services` for a single public port 80 -> container-port. Updating an existing service you own redeploys it. Set kvm=true for /dev/kvm and gpu-count>0 for NVIDIA GPUs (both non-privileged)."
    descriptions:
      zh: "将容器镜像部署为长期运行的 Kubernetes 服务（Deployment + Service）。用于沙箱需要访问的东西（应用、代理等），不是用来执行的。镜像原样运行（不注入 worker）。返回集群内地址与匿名公开地址（`https://<name>.<domain>`，每个公开端口一个）。用 `services` 声明端口：每项 `{ preset: tcp80|tcp443|udp443, target-port, name? }`。只有 tcp80 可公开访问（应用需在其目标端口提供 HTTP）；tcp443/udp443 仅集群内。相同 `name` 的项合并为一个 Service（多端口）；要第二个公开端点需不同的 `name`（其主机名为 `<name>-<name>.<domain>`）。省略 `services` 即单个公开端口 80 → 容器端口。更新自己拥有的服务即重新部署。kvm=true 可获 /dev/kvm，gpu-count>0 可获 NVIDIA GPU（均非特权）。"
    input_schema:
      type: object
      properties:
        image:
          type: string
          description: Image to deploy (see list-oci-images).
          descriptions:
            zh: 要部署的镜像（见 list-oci-images）。
        name:
          type: string
          description: "Service name (default: derived from the session)."
          descriptions:
            zh: 服务名（默认：由会话名派生）。
        container-port:
          type: integer
          description: Default target port for entries without one (default 8080).
          descriptions:
            zh: 未指定 target-port 的条目所用的默认容器端口（默认 8080）。
        service-port:
          type: integer
          description: Deprecated; prefer `services`.
          descriptions:
            zh: 已弃用；请用 `services`。
        replicas:
          type: integer
          description: Replicas (default 1).
          descriptions:
            zh: 副本数（默认 1）。
        cpu:
          type: string
          description: CPU request=limit (e.g. 250m). Omit for the deployment default (request 500m, limit 2).
          descriptions:
            zh: CPU 请求=上限（如 250m）。省略则用部署默认（请求 500m、上限 2）。
        memory:
          type: string
          description: Memory request=limit (e.g. 256Mi). Omit for the deployment default (request 1Gi, limit 4Gi).
          descriptions:
            zh: 内存请求=上限（如 256Mi）。省略则用部署默认（请求 1Gi、上限 4Gi）。
        command:
          type: array
          items:
            type: string
          description: 'Container ENTRYPOINT override (argv, executed directly with NO shell). Include the executable: ["/app/server","--listen=:8080"]. A bare flag like ["--listen=:8080"] is treated as the executable NAME and fails with RunContainerError. Omit to use the image ENTRYPOINT.'
          descriptions:
            zh: 容器 ENTRYPOINT 覆盖（argv，直接执行，不经 shell）。需包含可执行文件本身：["/app/server","--listen=:8080"]。若只写 ["--listen=:8080"]，该字符串会被当作可执行文件名而报 RunContainerError。省略则用镜像自带的 ENTRYPOINT。
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables.
          descriptions:
            zh: 环境变量。
        services:
          type: array
          description: "Ports to expose. Each: { preset (tcp80|tcp443|udp443), target-port, name? }. Omit for a single public port 80."
          descriptions:
            zh: 要暴露的端口。每项：{ preset (tcp80|tcp443|udp443), target-port, name? }。省略即单个公开端口 80。
          items:
            type: object
            properties:
              preset:
                type: string
                enum:
                  - tcp80
                  - tcp443
                  - udp443
              target-port:
                type: integer
                description: Container port to forward to (default container-port).
                descriptions:
                  zh: 转发的容器端口（默认 container-port）。
              name:
                type: string
                description: 'Service suffix: "" = primary; else a sibling service <name>-<suffix>.'
                descriptions:
                  zh: 服务后缀：空 = 主服务；否则为兄弟服务 <name>-<后缀>。
            required:
              - preset
        kvm:
          type: boolean
          description: Request KVM (/dev/kvm) — non-privileged, via the device plugin.
          descriptions:
            zh: 请求 KVM（/dev/kvm）——非特权，经 device plugin。
        gpu-count:
          type: integer
          description: Number of NVIDIA GPUs to request (0 = none; needs the GPU device plugin).
          descriptions:
            zh: 请求的 NVIDIA GPU 卡数（0 = 无；需 GPU device plugin）。
        volumes:
          type: array
          description: "PVCs to mount (from pvc-create). Each: { pvc, mount-path, read-only?, sub-path? }. The claim must exist and belong to this tenant."
          descriptions:
            zh: 要挂载的 PVC（来自 pvc-create）。每项：{ pvc, mount-path, read-only?, sub-path? }。该 PVC 必须存在且属于本租户。
          items:
            type: object
            properties:
              pvc:
                type: string
                description: PVC name (see pvc-list).
                descriptions:
                  zh: PVC 名称（见 pvc-list）。
              mount-path:
                type: string
                description: Absolute path inside the container.
                descriptions:
                  zh: 容器内的绝对路径。
              read-only:
                type: boolean
                description: Mount read-only (default false).
                descriptions:
                  zh: 只读挂载（默认 false）。
              sub-path:
                type: string
                description: Sub-path within the volume (optional).
                descriptions:
                  zh: 卷内的子路径（可选）。
            required:
              - pvc
              - mount-path
        slot:
          type: string
          enum:
            - blue
            - green
          description: Blue-green slot (default blue). Blue is the stable slot; green is the candidate. The primary URL always targets the ACTIVE slot; each slot also has its own address. Deploy green, verify it, then service-promote.
          descriptions:
            zh: 蓝绿槽位（默认 blue）。blue 为稳定槽；green 为候选槽。主地址始终指向当前 ACTIVE 槽；每个槽另有独立地址。先部署 green、验证后再 service-promote。
        resources:
          type: object
          description: Split resource requests/limits (overrides cpu/memory).
          descriptions:
            zh: 拆分资源 requests/limits（覆盖 cpu/memory）。
          properties:
            cpu:
              type: string
              description: CPU request (e.g. 100m).
              descriptions:
                zh: CPU 请求（如 100m）。
            memory:
              type: string
              description: Memory request (e.g. 128Mi).
              descriptions:
                zh: 内存请求（如 128Mi）。
            cpu-limit:
              type: string
              description: CPU limit.
              descriptions:
                zh: CPU 上限。
            memory-limit:
              type: string
              description: Memory limit.
              descriptions:
                zh: 内存上限。
        readiness-probe:
          type: object
          description: "A container probe. Set exactly one action: http-port (HTTP GET, with http-path), tcp-port (TCP connect), or exec-command (run in the container). Timing fields default to the k8s defaults."
          descriptions:
            zh: 容器探针。三个动作只设其一：http-port（HTTP GET，配 http-path）、tcp-port（TCP 连接）或 exec-command（在容器内执行）。时序字段默认用 k8s 默认值。
          properties:
            http-path:
              type: string
              description: HTTP path for http-port (default "/").
              descriptions:
                zh: http-port 的 HTTP 路径（默认 "/"）。
            http-port:
              type: integer
              description: HTTP GET port.
              descriptions:
                zh: HTTP GET 端口。
            tcp-port:
              type: integer
              description: TCP connect port.
              descriptions:
                zh: TCP 连接端口。
            exec-command:
              type: array
              items:
                type: string
              description: Exec command (argv).
              descriptions:
                zh: Exec 命令（argv）。
            initial-delay-seconds:
              type: integer
              description: initialDelaySeconds.
              descriptions:
                zh: initialDelaySeconds。
            period-seconds:
              type: integer
              description: periodSeconds.
              descriptions:
                zh: periodSeconds。
            timeout-seconds:
              type: integer
              description: timeoutSeconds.
              descriptions:
                zh: timeoutSeconds。
            failure-threshold:
              type: integer
              description: failureThreshold.
              descriptions:
                zh: failureThreshold。
            success-threshold:
              type: integer
              description: successThreshold.
              descriptions:
                zh: successThreshold。
        liveness-probe:
          type: object
          description: "A container probe. Set exactly one action: http-port (HTTP GET, with http-path), tcp-port (TCP connect), or exec-command (run in the container). Timing fields default to the k8s defaults."
          descriptions:
            zh: 容器探针。三个动作只设其一：http-port（HTTP GET，配 http-path）、tcp-port（TCP 连接）或 exec-command（在容器内执行）。时序字段默认用 k8s 默认值。
          properties:
            http-path:
              type: string
              description: HTTP path for http-port (default "/").
              descriptions:
                zh: http-port 的 HTTP 路径（默认 "/"）。
            http-port:
              type: integer
              description: HTTP GET port.
              descriptions:
                zh: HTTP GET 端口。
            tcp-port:
              type: integer
              description: TCP connect port.
              descriptions:
                zh: TCP 连接端口。
            exec-command:
              type: array
              items:
                type: string
              description: Exec command (argv).
              descriptions:
                zh: Exec 命令（argv）。
            initial-delay-seconds:
              type: integer
              description: initialDelaySeconds.
              descriptions:
                zh: initialDelaySeconds。
            period-seconds:
              type: integer
              description: periodSeconds.
              descriptions:
                zh: periodSeconds。
            timeout-seconds:
              type: integer
              description: timeoutSeconds.
              descriptions:
                zh: timeoutSeconds。
            failure-threshold:
              type: integer
              description: failureThreshold.
              descriptions:
                zh: failureThreshold。
            success-threshold:
              type: integer
              description: successThreshold.
              descriptions:
                zh: successThreshold。
        startup-probe:
          type: object
          description: "A container probe. Set exactly one action: http-port (HTTP GET, with http-path), tcp-port (TCP connect), or exec-command (run in the container). Timing fields default to the k8s defaults."
          descriptions:
            zh: 容器探针。三个动作只设其一：http-port（HTTP GET，配 http-path）、tcp-port（TCP 连接）或 exec-command（在容器内执行）。时序字段默认用 k8s 默认值。
          properties:
            http-path:
              type: string
              description: HTTP path for http-port (default "/").
              descriptions:
                zh: http-port 的 HTTP 路径（默认 "/"）。
            http-port:
              type: integer
              description: HTTP GET port.
              descriptions:
                zh: HTTP GET 端口。
            tcp-port:
              type: integer
              description: TCP connect port.
              descriptions:
                zh: TCP 连接端口。
            exec-command:
              type: array
              items:
                type: string
              description: Exec command (argv).
              descriptions:
                zh: Exec 命令（argv）。
            initial-delay-seconds:
              type: integer
              description: initialDelaySeconds.
              descriptions:
                zh: initialDelaySeconds。
            period-seconds:
              type: integer
              description: periodSeconds.
              descriptions:
                zh: periodSeconds。
            timeout-seconds:
              type: integer
              description: timeoutSeconds.
              descriptions:
                zh: timeoutSeconds。
            failure-threshold:
              type: integer
              description: failureThreshold.
              descriptions:
                zh: failureThreshold。
            success-threshold:
              type: integer
              description: successThreshold.
              descriptions:
                zh: successThreshold。
        rollout:
          type: object
          description: RollingUpdate strategy (k8s quantity/percent, e.g. "25%" or "1").
          descriptions:
            zh: RollingUpdate 策略（k8s 数量/百分比，如 "25%" 或 "1"）。
          properties:
            max-surge:
              type: string
              description: maxSurge.
              descriptions:
                zh: maxSurge。
            max-unavailable:
              type: string
              description: maxUnavailable.
              descriptions:
                zh: maxUnavailable。
        env-refs:
          type: array
          description: "Env vars from a ConfigMap/Secret key. Each: { name, config-map?, config-key?, secret?, secret-key? }."
          descriptions:
            zh: 从 ConfigMap/Secret 的键注入环境变量。每项：{ name, config-map?, config-key?, secret?, secret-key? }。
          items:
            type: object
            properties:
              name:
                type: string
                description: Env var name.
                descriptions:
                  zh: 环境变量名。
              config-map:
                type: string
                description: ConfigMap name.
                descriptions:
                  zh: ConfigMap 名。
              config-key:
                type: string
                description: ConfigMap key.
                descriptions:
                  zh: ConfigMap 键。
              secret:
                type: string
                description: Secret name.
                descriptions:
                  zh: Secret 名。
              secret-key:
                type: string
                description: Secret key.
                descriptions:
                  zh: Secret 键。
            required:
              - name
        env-from:
          type: array
          description: "Inject ALL keys of a ConfigMap or Secret as env. Each: { config-map?, secret? }."
          descriptions:
            zh: 把 ConfigMap 或 Secret 的所有键注入为环境变量。每项：{ config-map?, secret? }。
          items:
            type: object
            properties:
              config-map:
                type: string
                description: ConfigMap name.
                descriptions:
                  zh: ConfigMap 名。
              secret:
                type: string
                description: Secret name.
                descriptions:
                  zh: Secret 名。
        config-mounts:
          type: array
          description: "Mount a ConfigMap/Secret as a volume. Each: { config-map?, secret?, mount-path, items?: [{key, path}] }."
          descriptions:
            zh: "把 ConfigMap/Secret 挂载为卷。每项：{ config-map?, secret?, mount-path, items?: [{key, path}] }。"
          items:
            type: object
            properties:
              config-map:
                type: string
                description: ConfigMap name.
                descriptions:
                  zh: ConfigMap 名。
              secret:
                type: string
                description: Secret name.
                descriptions:
                  zh: Secret 名。
              mount-path:
                type: string
                description: Absolute mount path in the container.
                descriptions:
                  zh: 容器内绝对挂载路径。
              items:
                type: array
                description: Keys to project into files.
                descriptions:
                  zh: 要投射为文件的键。
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      description: Key.
                      descriptions:
                        zh: 键。
                    path:
                      type: string
                      description: Relative file path.
                      descriptions:
                        zh: 相对文件路径。
                  required:
                    - key
                    - path
            required:
              - mount-path
        sidecars:
          type: array
          description: "Extra containers. init=true makes an init container. Each: { name, image, command?, env?, cpu?, memory?, init? }."
          descriptions:
            zh: 附加容器。init=true 即初始化容器。每项：{ name, image, command?, env?, cpu?, memory?, init? }。
          items:
            type: object
            properties:
              name:
                type: string
                description: Container name.
                descriptions:
                  zh: 容器名。
              image:
                type: string
                description: Image.
                descriptions:
                  zh: 镜像。
              command:
                type: array
                items:
                  type: string
                description: Command override (argv).
                descriptions:
                  zh: 命令覆盖（argv）。
              env:
                type: object
                additionalProperties:
                  type: string
                description: Env vars.
                descriptions:
                  zh: 环境变量。
              cpu:
                type: string
                description: CPU request.
                descriptions:
                  zh: CPU 请求。
              memory:
                type: string
                description: Memory request.
                descriptions:
                  zh: 内存请求。
              init:
                type: boolean
                description: Run as an init container.
                descriptions:
                  zh: 作为初始化容器运行。
            required:
              - name
              - image
        node-selector:
          type: object
          additionalProperties:
            type: string
          description: nodeSelector labels.
          descriptions:
            zh: nodeSelector 标签。
        tolerations:
          type: array
          description: "Pod tolerations. Each: { key, operator?, value?, effect? }."
          descriptions:
            zh: Pod 容忍。每项：{ key, operator?, value?, effect? }。
          items:
            type: object
            properties:
              key:
                type: string
                description: Taint key.
                descriptions:
                  zh: 污点键。
              operator:
                type: string
                enum:
                  - Equal
                  - Exists
              value:
                type: string
                description: Taint value.
                descriptions:
                  zh: 污点值。
              effect:
                type: string
                enum:
                  - NoSchedule
                  - PreferNoSchedule
                  - NoExecute
            required:
              - key
      required: []
    required_config:
      - gateway-url
      - gateway-token
  - name: service-promote
    description: "Blue-green promotion: switch the service's primary URL to the non-active slot (blue<->green). By default the target slot must be fully ready; set force=true to override. Use after deploying and verifying the green slot. RollbackService switches back."
    descriptions:
      zh: 蓝绿提升：把服务主地址切到当前非 ACTIVE 的槽（blue<->green）。默认要求目标槽全部就绪；force=true 可强制。用于部署并验证 green 之后。service-rollback 可切回。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
        force:
          type: boolean
          description: Promote even if the target slot is not fully ready.
          descriptions:
            zh: 即使目标槽未全部就绪也强制提升。
      required:
        - name
    required_config:
      - gateway-url
      - gateway-token
  - name: service-rollback
    description: "Blue-green rollback: switch the service's primary URL back to the other slot (the inverse of service-promote)."
    descriptions:
      zh: 蓝绿回滚：把服务主地址切回另一个槽（service-promote 的逆操作）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
      required:
        - name
    required_config:
      - gateway-url
      - gateway-token
  - name: service-list
    description: List the services this tenant deployed (name, phase, image, in-cluster url, ports, public urls, replicas).
    descriptions:
      zh: 列出本租户部署的服务（名称、状态、镜像、集群内地址、端口、公开地址、副本数）。
    input_schema:
      type: object
      properties: {}
      required: []
    required_config:
      - gateway-url
      - gateway-token
  - name: service-delete
    description: Delete a deployed service (Deployment + Service).
    descriptions:
      zh: 删除已部署的服务（Deployment + Service）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
      required:
        - name
    required_config:
      - gateway-url
      - gateway-token
  - name: service-logs
    description: Read a service's container log (a bounded tail). Use `previous` to read the crashed instance before a restart (CrashLoopBackOff). Cluster-observed via the gateway.
    descriptions:
      zh: 读取服务的容器日志（有界 tail）。用 `previous` 读取重启前崩溃的那次实例（CrashLoopBackOff）。经 gateway 从集群读取。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Service name.
          descriptions:
            zh: 服务名。
        tail-lines:
          type: integer
          description: Number of trailing lines (0 = deployment default).
          descriptions:
            zh: 末尾行数（0 = 部署默认）。
        previous:
          type: boolean
          description: Read the previous container instance (the crash).
          descriptions:
            zh: 读取上一个容器实例（崩溃那次）。
      required:
        - name
    required_config:
      - gateway-url
      - gateway-token
  - name: helm-deploy
    description: Render a Helm chart from the repository and apply it to the cluster as a RELEASE (create or upgrade). The chart is the repo-relative directory holding Chart.yaml (`chart-path`, default "."). `values` is the values.yaml content. The rendered manifest is filtered to a safe namespaced kind whitelist (no cluster-scoped/RBAC/CRD/privileged/hostPath) and pinned to the managed namespace. Set dry-run=true to render + validate only. Records a revision you can roll back to.
    descriptions:
      zh: 把仓库中的 Helm chart 渲染并应用到集群为一个 RELEASE（创建或升级）。chart 是仓库内包含 Chart.yaml 的目录（`chart-path`，默认 "."）。`values` 是 values.yaml 内容。渲染结果会被过滤为安全的、限定命名空间的 kind 白名单（禁止 cluster-scoped/RBAC/CRD/privileged/hostPath），并固定到受管命名空间。dry-run=true 只渲染+校验。会记录可回滚的 revision。
    input_schema:
      type: object
      properties:
        release:
          type: string
          description: Release name (a DNS-1123 label).
          descriptions:
            zh: Release 名称（DNS-1123 label）。
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        chart-path:
          type: string
          description: Repo-relative chart directory (holds Chart.yaml; default ".").
          descriptions:
            zh: 仓库内 chart 目录（含 Chart.yaml；默认 "."）。
        values:
          type: string
          description: values.yaml content.
          descriptions:
            zh: values.yaml 内容。
        dry-run:
          type: boolean
          description: Render + validate only (no apply).
          descriptions:
            zh: 仅渲染+校验（不应用）。
        slot:
          type: string
          enum:
            - blue
            - green
          description: Blue-green slot (empty = a plain release). A slot deploy stores the release as <release>-<slot> and creates/keeps a router Service <release>; the router targets the ACTIVE slot. Deploy green, verify, then helm-promote.
          descriptions:
            zh: 蓝绿槽位（空 = 普通 release）。槽位部署会把 release 存为 <release>-<slot>，并创建/保留路由器 Service <release>；路由器指向当前 ACTIVE 槽。先部署 green、验证后再 helm-promote。
      required:
        - release
        - org
        - repo
    required_config:
      - gateway-url
      - gateway-token
  - name: helm-promote
    description: "Blue-green Helm promotion: switch the release's router Service to the non-active slot (blue<->green). By default the target slot must be fully ready; force=true overrides. helm-rollback-release switches back."
    descriptions:
      zh: 蓝绿 Helm 提升：把 release 的路由器 Service 切到当前非 ACTIVE 的槽（blue<->green）。默认要求目标槽全部就绪；force=true 可强制。helm-rollback-release 可切回。
    input_schema:
      type: object
      properties:
        release:
          type: string
          description: Release (router) name.
          descriptions:
            zh: Release（路由器）名称。
        force:
          type: boolean
          description: Promote even if the target slot is not fully ready.
          descriptions:
            zh: 即使目标槽未全部就绪也强制提升。
      required:
        - release
    required_config:
      - gateway-url
      - gateway-token
  - name: helm-rollback-release
    description: "Blue-green Helm rollback: switch the release's router Service back to the other slot (the inverse of helm-promote). Distinct from helm-rollback, which re-applies a chart revision."
    descriptions:
      zh: 蓝绿 Helm 回滚：把 release 的路由器 Service 切回另一个槽（helm-promote 的逆操作）。与 helm-rollback（重新应用某个 chart revision）不同。
    input_schema:
      type: object
      properties:
        release:
          type: string
          description: Release (router) name.
          descriptions:
            zh: Release（路由器）名称。
      required:
        - release
    required_config:
      - gateway-url
      - gateway-token
  - name: helm-list
    description: List the Helm releases this tenant deployed (name, revision, status, chart path/ref).
    descriptions:
      zh: 列出本租户部署的 Helm release（名称、revision、状态、chart 路径/ref）。
    input_schema:
      type: object
      properties: {}
      required: []
    required_config:
      - gateway-url
      - gateway-token
  - name: helm-history
    description: Show a Helm release's revision history (chart path, ref, objects per revision).
    descriptions:
      zh: 查看某个 Helm release 的 revision 历史（每个 revision 的 chart 路径、ref、对象）。
    input_schema:
      type: object
      properties:
        release:
          type: string
          description: Release name.
          descriptions:
            zh: Release 名称。
      required:
        - release
    required_config:
      - gateway-url
      - gateway-token
  - name: helm-rollback
    description: Roll a Helm release back to a prior revision (re-applies that revision's manifest and records a new revision). revision=0 means the previous revision.
    descriptions:
      zh: 把 Helm release 回滚到某个历史 revision（重新应用该 revision 的清单并记录一个新 revision）。revision=0 表示上一个 revision。
    input_schema:
      type: object
      properties:
        release:
          type: string
          description: Release name.
          descriptions:
            zh: Release 名称。
        revision:
          type: integer
          description: Target revision (0 = previous).
          descriptions:
            zh: 目标 revision（0 = 上一个）。
      required:
        - release
    required_config:
      - gateway-url
      - gateway-token
  - name: helm-uninstall
    description: Delete a Helm release and every object it created. Destructive.
    descriptions:
      zh: 删除 Helm release 及其创建的所有对象。破坏性操作。
    input_schema:
      type: object
      properties:
        release:
          type: string
          description: Release name.
          descriptions:
            zh: Release 名称。
      required:
        - release
    required_config:
      - gateway-url
      - gateway-token
  - name: pvc-create
    description: "Create a named, tenant-owned PersistentVolumeClaim (admin) for service data. Services mount it by name via service-deploy `volumes`. Uses the deployment storage class (self-hosted local-path -> /home/develop/PVC on the host). NOTE: local-path does not enforce `size`; a fresh PVC stays Pending until a service mounts it."
    descriptions:
      zh: 创建命名、归属本租户的 PersistentVolumeClaim（管理员），用于服务数据。服务通过 service-deploy 的 `volumes` 按名挂载。使用部署存储类（自建 local-path → 宿主机 /home/develop/PVC）。注意：local-path 不强制 `size`；新建的 PVC 在有服务挂载前保持 Pending。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: PVC name (a DNS-1123 label).
          descriptions:
            zh: PVC 名称（DNS-1123 label）。
        size:
          type: string
          description: Requested size, e.g. 1Gi (default 1Gi). Not enforced by local-path.
          descriptions:
            zh: 请求容量，如 1Gi（默认 1Gi）。local-path 不强制。
        storage-class:
          type: string
          description: StorageClass (default the deployment class; only that value is accepted).
          descriptions:
            zh: 存储类（默认为部署配置的类；仅接受该值）。
      required:
        - name
    required_config:
      - gateway-url
      - gateway-token
  - name: pvc-list
    description: List the tenant's PVCs (name, phase, size, storage class, and which services mount each).
    descriptions:
      zh: 列出本租户的 PVC（名称、状态、容量、存储类，以及哪些服务正在挂载）。
    input_schema:
      type: object
      properties: {}
      required: []
    required_config:
      - gateway-url
      - gateway-token
  - name: pvc-delete
    description: "Delete a PVC (admin). REFUSED while any service still mounts it. Deletion is destructive: local-path removes the on-disk directory (reclaim policy Delete)."
    descriptions:
      zh: 删除 PVC（管理员）。若有服务仍在挂载则拒绝。删除是破坏性的：local-path 会删除磁盘目录（回收策略 Delete）。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: PVC name.
          descriptions:
            zh: PVC 名称。
      required:
        - name
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-file-read
    description: Read a text file from a repository ref, line-numbered (1-based), windowed by offset/limit.
    descriptions:
      zh: 从仓库某个 ref 读取文本文件，带行号（从 1 开始），用 offset/limit 分窗。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        path:
          type: string
          description: File path, relative to the repository root.
          descriptions:
            zh: 文件路径，相对于仓库根目录。
        offset:
          type: integer
          description: Start line (0-based, default 0).
          descriptions:
            zh: 起始行（从 0 开始，默认 0）。
        limit:
          type: integer
          description: Maximum lines (default 200, max 1000).
          descriptions:
            zh: 最多行数（默认 200，最大 1000）。
      required:
        - org
        - repo
        - path
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-file-list
    description: List a repository directory (or a single file) at a ref.
    descriptions:
      zh: 列出仓库某个 ref 下的目录（或单个文件）。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        path:
          type: string
          description: "Directory or file path (default: repository root)."
          descriptions:
            zh: 目录或文件路径（默认：仓库根目录）。
      required:
        - org
        - repo
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-log
    description: View commit history, optionally scoped to a path and/or ref.
    descriptions:
      zh: 查看提交历史，可限定路径与/或 ref。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        path:
          type: string
          description: Only commits touching this path.
          descriptions:
            zh: 仅包含涉及该路径的提交。
        limit:
          type: integer
          description: Maximum commits (default 50, max 200).
          descriptions:
            zh: 最多提交数（默认 50，最大 200）。
      required:
        - org
        - repo
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-show
    description: "Show one commit: metadata plus its unified diff."
    descriptions:
      zh: 查看单个提交：元数据及其 unified diff。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        sha:
          type: string
          description: Commit sha.
          descriptions:
            zh: 提交 sha。
      required:
        - org
        - repo
        - sha
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-diff
    description: Compare two refs (base...head), returning per-file patches.
    descriptions:
      zh: 比较两个 ref（base...head），返回逐文件补丁。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        base:
          type: string
          description: Base ref (branch/sha/tag).
          descriptions:
            zh: 基础 ref（分支/sha/标签）。
        head:
          type: string
          description: Head ref (branch/sha/tag).
          descriptions:
            zh: 目标 ref（分支/sha/标签）。
      required:
        - org
        - repo
        - base
        - head
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-branches
    description: List the repository branches.
    descriptions:
      zh: 列出仓库分支。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
      required:
        - org
        - repo
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-tags
    description: List the repository tags.
    descriptions:
      zh: 列出仓库标签。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
      required:
        - org
        - repo
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-tag-create
    description: "Create a tag at a target ref (default: the repository default branch). OWN repository only (`org`/`repo` default to the session's; a mismatching value is refused)."
    descriptions:
      zh: 在某个目标 ref 创建标签（默认：仓库默认分支）。仅限本会话**自己的仓库**（`org`/`repo` 默认取会话自己的；不一致会被拒绝）。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: "Organization of YOUR repository (default: the session's org). Must match the session's repo."
          descriptions:
            zh: 你自己仓库的组织（默认：当前会话的 org）。必须与会话的仓库一致。
        repo:
          type: string
          description: "Your repository name (default: the session's repo). Must match the session's repo."
          descriptions:
            zh: 你自己的仓库名（默认：当前会话的仓库）。必须与会话的仓库一致。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        name:
          type: string
          description: Tag name.
          descriptions:
            zh: 标签名。
        target:
          type: string
          description: "Target ref (default: the repo default branch)."
          descriptions:
            zh: 目标 ref（默认：仓库默认分支）。
      required:
        - name
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-mr-list
    description: "List pull requests (optional state filter: open|closed|all)."
    descriptions:
      zh: 列出合并请求（可选状态：open|closed|all）。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        state:
          type: string
          description: State filter (open|closed|all).
          descriptions:
            zh: 状态过滤（open|closed|all）。
      required:
        - org
        - repo
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-mr-comment
    description: Comment on a pull request.
    descriptions:
      zh: 在合并请求上评论。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        index:
          type: integer
          description: Pull request number.
          descriptions:
            zh: 合并请求编号。
        body:
          type: string
          description: Comment body.
          descriptions:
            zh: 评论内容。
      required:
        - org
        - repo
        - index
        - body
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-mail-send
    description: Send a message into a repository branch's session mailbox (wakes that session's turn). Addressing is by org/repo + optional branch (default main); the branch session is created if needed. ALL real branches are peers — you may message any branch of any repository you can see (cross-repo allowed). The one restriction is that the target may NOT be an `mr/...` branch (a system MR head has no session).
    descriptions:
      zh: 向某仓库分支的会话邮箱投递一条消息（唤醒该会话的回合）。按 org/repo + 可选 branch（默认 main）寻址；分支会话不存在时会自动创建。所有真实分支都是对等的——你可以向你能看到的任何仓库的任意分支发消息（允许跨仓库）。唯一限制：目标不能是 `mr/...` 分支（系统 MR 头分支没有对应会话）。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        branch:
          type: string
          description: "Target branch (default: main)."
          descriptions:
            zh: 目标分支（默认：main）。
        text:
          type: string
          description: Message text.
          descriptions:
            zh: 消息内容。
      required:
        - org
        - repo
        - text
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-mr-merge
    description: >-
      Merge a change request. Allowed ONLY when the MR's `base` is your own
      branch (self-merge); the gateway enforces this from your session. The
      `mr/...` head branch is deleted on merge.
    descriptions:
      zh: >-
        合并合并请求。仅当该 MR 的 `base` 是你自己分支时才允许（自合并）；gateway 依据你的会话强制此规则。合并后 `mr/...` 头分支会被删除。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        index:
          type: integer
          description: Pull request number.
          descriptions:
            zh: 合并请求编号。
      required:
        - org
        - repo
        - index
    required_config:
      - gateway-url
      - gateway-token
  - name: repo-mr-close
    description: >-
      Close a change request WITHOUT merging it. Allowed ONLY when the MR's
      `base` is your own branch (same rule as repo-mr-merge). The `mr/...` head
      branch is deleted on close.
    descriptions:
      zh: >-
        关闭合并请求（不合并）。仅当该 MR 的 `base` 是你自己分支时才允许（与 repo-mr-merge 同规则）。关闭后 `mr/...` 头分支会被删除。
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization (owner) of the repository.
          descriptions:
            zh: 仓库所属组织（owner）。
        repo:
          type: string
          description: Repository name.
          descriptions:
            zh: 仓库名。
        ref:
          type: string
          description: "Git ref: branch, commit sha or tag. Omitted = the repository default branch."
          descriptions:
            zh: Git 引用：分支、提交 sha 或标签。省略 = 仓库默认分支。
        index:
          type: integer
          description: Pull request number.
          descriptions:
            zh: 合并请求编号。
      required:
        - org
        - repo
        - index
    required_config:
      - gateway-url
      - gateway-token

config:
  - name: gateway-url
    type: string
    default: ""
    scope: global
    description: Base URL of the workspace-gateway service (e.g. http://workspace-gateway:80).
    descriptions:
      zh: workspace-gateway 服务的基础地址（如 http://workspace-gateway:80）。
  - name: gateway-token
    type: string
    default: ""
    scope: global
    description: Service token the workspace-gateway requires for sandbox RPCs.
    descriptions:
      zh: workspace-gateway 在沙箱 RPC 上要求的服务令牌。

# Session-scoped prompt variables: a branch session's `org`/`repo`/`branch` are
# resolved from its `org:repo:branch` name and substituted into the role system
# prompts (`{{vars.workspace.org}}` etc.). A free session (no colons) resolves
# to empty strings. The resolvers live in src/index.ts.
variables:
  - { name: org, scope: session }
  - { name: repo, scope: session }
  - { name: branch, scope: session }
